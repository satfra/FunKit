# Boilerplate: Yang-Mills theory (gluon A with Lorentz index "v" and color
# index "col"; Grassmann ghost pair cb/c with color index "col").
# Mirrors GetFunKitSetupYangMills[] in FunKit tests/boilerplate/setups.m.
#
# The equation is the Wetterich flow RHS, 1/2 G^{ab} Rdot_{ba}, with the
# trace legs running over the full field space (AnyField).
# NOTE: the gFields pair is meant as (antifield, field) = (cb, c);
# see the parser note on table iteration order.

equation = [
  [
  { prefactor = 0.5 },
  { type = "FDOp", legs = [ [ "A", 6 ] ] },
  { type = "FDOp", legs = [ [ "A", 5 ] ] },
  { type = "FDOp", legs = [ [ "A", 4 ] ] },
  { type = "FDOp", legs = [ [ "A", 3 ] ] },
  { type = "Propagator", legs = [ [ "AnyField", 1 ], [ "AnyField", 2 ] ] },
  { type = "Rdot", legs = [ [ "AnyField", -1 ], [ "AnyField", -2 ] ] }
  ]
]

# The derivatives the FDOps above were built from: asserts that the equation is
# symmetric under permuting these external legs, letting the parser generate
# the full S_4 symmetry group for simplify.
derivatives = [ [ "A", 3 ], [ "A", 4 ], [ "A", 5 ], [ "A", 6 ] ]

[setup]
debug = 1
ordered = [ "Rdot" ]
correlators = [ ]

do_truncate = true
do_simplify = true

  [[setup.cFields]]
  A = [ "v", "col" ]

  [[setup.gFields]]
  cb = [ "col" ]
  c = [ "col" ]

[setup.truncation]
Rdot = [ [ "A", "A" ], [ "cb", "c" ] ]
Propagator = [ [ "A", "A" ], [ "cb", "c" ] ]
GammaN = [
  [ "A", "A" ],
  [ "cb", "c" ],
  [ "A", "A", "A" ],
  [ "A", "A", "A", "A" ],
  [ "A", "cb", "c" ],
]
