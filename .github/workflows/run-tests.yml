name: run-tests
on: push
jobs:
  build:
    # Runs on the self-hosted runner on franzArch, which has a fully licensed
    # native Wolfram install plus all build tools (cmake/make/git/form/unzip).
    runs-on: [self-hosted, wolfram]

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup build and install
        id: build
        run: |
          mkdir -p $GITHUB_WORKSPACE/build
          cd $GITHUB_WORKSPACE/build
          cmake -DCMAKE_BUILD_TYPE=Release $GITHUB_WORKSPACE
          make install

      # Runs only when the build succeeded (default fail-fast). Uses `set +e` so a
      # test failure doesn't abort here -- we record the result, publish the badge,
      # then fail the job at the end so a red badge is still written on failure.
      - name: Run tests
        id: tests
        run: |
          cd "$GITHUB_WORKSPACE/build"
          # tee so output streams to the live Actions log AND is captured for the
          # step summary. pipefail makes $? reflect make's exit, not tee's.
          # (Don't redirect to build/test.log — CMake's test target already tees there.)
          set -o pipefail
          set +e
          make test 2>&1 | tee make-test.log
          set -e
          {
            echo "## Test output"
            echo '```'
            cat make-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Parse the Overall Test Summary line: "✓ N passed    x M failed".
          # The summary is the last line in the log matching that shape (each per-file
          # report also matches; the Overall summary is emitted last by tests/Test.m).
          summary=$(grep -E '[0-9]+ passed[[:space:]]+.*[0-9]+ failed' make-test.log | tail -1 || true)
          passed=$(printf '%s' "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)
          failed=$(printf '%s' "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || echo 0)
          total=$((${passed:-0} + ${failed:-0}))
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "total=$total"   >> "$GITHUB_OUTPUT"
          echo "### Tests: ${passed}/${total} passing" >> "$GITHUB_STEP_SUMMARY"

      # The same suite again through the C++ engine (CoBra). This is what users actually get:
      # $FunKitBackend defaults to "Automatic", which activates the engine on the first pipeline
      # call, so the C++ path -- not the Mathematica one -- is the default configuration and has
      # to be green. It went untested for a long time, which is how several backend-only bugs
      # shipped. Needs CMake >= 3.20 and a C++20 compiler with OpenMP on the runner, plus network
      # access on the very first configure to fetch the test framework; with FUNKIT_TEST_BACKEND
      # set, tests/init.m calls FSetBackendCpp[] outright, so a missing toolchain fails loudly
      # here instead of silently falling back to the Mathematica implementation.
      - name: Run tests (C++ backend)
        id: tests_cpp
        run: |
          cd "$GITHUB_WORKSPACE/build"
          set -o pipefail
          set +e
          FUNKIT_TEST_BACKEND=Cpp make test 2>&1 | tee make-test-cpp.log
          set -e
          {
            echo "## Test output (C++ backend)"
            echo '```'
            cat make-test-cpp.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          summary=$(grep -E '[0-9]+ passed[[:space:]]+.*[0-9]+ failed' make-test-cpp.log | tail -1 || true)
          passed=$(printf '%s' "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)
          failed=$(printf '%s' "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || echo 0)
          total=$((${passed:-0} + ${failed:-0}))
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "total=$total"   >> "$GITHUB_OUTPUT"
          echo "### Tests (C++ backend): ${passed}/${total} passing" >> "$GITHUB_STEP_SUMMARY"

      # Decide the badge text/colour. Runs even if the build failed (always()), so a
      # broken build shows a red "build failed" badge instead of leaving the gist at
      # its stale value. Both backends run the same suite, so a green badge reports the
      # shared count; either one failing turns it red and names the culprit, so a
      # backend-only regression can never hide behind a green badge.
      - name: Compute badge content
        id: badge
        if: always() && github.event_name == 'push'
        env:
          MMA_PASSED: ${{ steps.tests.outputs.passed }}
          MMA_FAILED: ${{ steps.tests.outputs.failed }}
          MMA_TOTAL:  ${{ steps.tests.outputs.total }}
          CPP_PASSED: ${{ steps.tests_cpp.outputs.passed }}
          CPP_FAILED: ${{ steps.tests_cpp.outputs.failed }}
          CPP_TOTAL:  ${{ steps.tests_cpp.outputs.total }}
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "message=build failed" >> "$GITHUB_OUTPUT"
            echo "color=red"            >> "$GITHUB_OUTPUT"
          elif [ -z "$MMA_TOTAL" ] || [ "$MMA_TOTAL" = "0" ] \
            || [ -z "$CPP_TOTAL" ] || [ "$CPP_TOTAL" = "0" ]; then
            echo "message=no tests run" >> "$GITHUB_OUTPUT"
            echo "color=red"            >> "$GITHUB_OUTPUT"
          elif [ "$MMA_FAILED" != "0" ] && [ "$CPP_FAILED" != "0" ]; then
            echo "message=$MMA_FAILED failed (mma), $CPP_FAILED failed (c++)" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          elif [ "$MMA_FAILED" != "0" ]; then
            echo "message=$MMA_FAILED failed (mma)" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          elif [ "$CPP_FAILED" != "0" ]; then
            echo "message=$CPP_FAILED failed (c++)" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          else
            # Both green and both run the same suite: report the shared count once.
            echo "message=$MMA_PASSED/$MMA_TOTAL passing" >> "$GITHUB_OUTPUT"
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          fi

      # Publish to the Gist that shields.io reads. Only on push: PRs (esp. from
      # forks) can't access secrets. The Gist ID below points at the public Gist
      # `satfra/funkit-tests.json` created for this badge.
      - name: Update test-count badge
        if: always() && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 5274b1492e4a72ebb1aa57a7d60b0267
          filename: funkit-tests.json
          label: tests
          message: ${{ steps.badge.outputs.message }}
          color:   ${{ steps.badge.outputs.color }}

      # Reflect build/test failures in the job conclusion (the test step swallows
      # make's exit code on purpose so the badge gets written first).
      - name: Fail the job if the build or any test failed
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build failed."
            exit 1
          fi
          if [ "${{ steps.tests.outputs.failed }}" != "0" ]; then
            echo "${{ steps.tests.outputs.failed }} test(s) failed on the Mathematica backend."
            exit 1
          fi
          if [ "${{ steps.tests_cpp.outputs.failed }}" != "0" ]; then
            echo "${{ steps.tests_cpp.outputs.failed }} test(s) failed on the C++ backend."
            exit 1
          fi
          # A suite that reported nothing is a failure too: with FUNKIT_TEST_BACKEND=Cpp a missing
          # toolchain aborts tests/init.m, which would otherwise leave the counts empty and pass.
          if [ -z "${{ steps.tests.outputs.total }}" ] || [ "${{ steps.tests.outputs.total }}" = "0" ] \
            || [ -z "${{ steps.tests_cpp.outputs.total }}" ] || [ "${{ steps.tests_cpp.outputs.total }}" = "0" ]; then
            echo "A test suite produced no results."
            exit 1
          fi
