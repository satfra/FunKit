name: run-tests
on: push
jobs:
  build:
    # Runs on the self-hosted runner on franzArch, which has a fully licensed
    # native Wolfram install plus all build tools (cmake/make/git/form/unzip).
    runs-on: [self-hosted, wolfram]

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup build and install
        run: |
          mkdir -p $GITHUB_WORKSPACE/build
          cd $GITHUB_WORKSPACE/build
          cmake -DCMAKE_BUILD_TYPE=Release $GITHUB_WORKSPACE
          make install

      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE/build
          set +e
          make test > test.log 2>&1
          res=$?
          set -e
          {
            echo "## Test output"
            echo '```'
            cat test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # if tests failed, fail the step
          if [ "$res" -ne 0 ]; then
            echo "# ❌ Tests failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
